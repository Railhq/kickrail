name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # Never checks out pull request code: it only reads comments and records signatures.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/Railhq/kickrail/blob/main/CLA.md
          branch: cla-signatures
          allowlist: markqian,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: "Thanks for the pull request! Before we can merge it, please read our [Contributor License Agreement](https://github.com/Railhq/kickrail/blob/main/CLA.md) and sign it by posting the comment below. You keep the copyright in your work; it covers all your future contributions too."
          custom-allsigned-prcomment: "All contributors have signed the CLA. Thank you!"
          lock-pullrequest-aftermerge: false
